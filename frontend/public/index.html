<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app use the iPhone safe areas (notch, home bar). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Find the vibe. Book in seconds. Concerts, comedy, workshops and more near you." />
    <meta name="theme-color" content="#0D0B1A" />

    <!-- Installable web app ("Add to Home Screen"). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GatherSpace" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* Night background while the bundle loads (no white flash). */
        background-color: #0D0B1A;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run GatherSpace.
    </noscript>
    <div id="root"></div>
  </body>
</html>
