# Backend CI/CD
#   every push / PR touching the backend → run the test suite
#   push to main                         → build image → push to GHCR → deploy to Lightsail
#
# Deploy needs (Settings → Secrets and variables → Actions):
#   secrets:   LIGHTSAIL_HOST, LIGHTSAIL_USER, LIGHTSAIL_SSH_KEY
#   variables: DEPLOY_ENABLED=true   (leave unset until the server exists)
#              API_DOMAIN=api.gatherspace.in
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "deploy/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "deploy/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/maq20261-sudo/gatherspace-backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: gatherspace_test
      JWT_SECRET_KEY: ci-only-secret
      FIREBASE_DEV_BYPASS: "1"
      MSG91_MOCK_MODE: "1"
      DISABLE_RATE_LIMIT: "1"
      ORGANIZER_FREE_EVENT_LIMIT: "1000"
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8001
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Start API
        run: |
          nohup uvicorn server:app --host 127.0.0.1 --port 8001 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/api/health && exit 0; sleep 1; done
          cat uvicorn.log; exit 1
      - run: python seed.py
      - name: Tests
        # test_only_past... depends on data from the old Emergent database.
        run: >-
          pytest -q -p no:cacheprovider
          --deselect tests/test_past_events_and_sort.py::TestDiscoverFeed::test_only_past_returns_only_ended_events
      - if: failure()
        run: cat uvicorn.log

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/backup.sh,deploy/set-secret.sh"
          target: /opt/gatherspace
          strip_components: 1
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,API_DOMAIN
          script: |
            set -euo pipefail
            cd /opt/gatherspace
            chmod +x backup.sh set-secret.sh
            printf 'IMAGE_TAG=%s\nAPI_DOMAIN=%s\n' "$IMAGE_TAG" "$API_DOMAIN" > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            mkdir -p web/releases
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # The Caddyfile is a single-file bind mount: a copied-over file is
            # a new inode the running container doesn't see. Recreate Caddy
            # when its config changed.
            new_sum=$(sha256sum Caddyfile | cut -c1-64)
            if [ "$new_sum" != "$(cat .caddyfile.sha256 2>/dev/null || true)" ]; then
              docker compose -f docker-compose.prod.yml up -d --force-recreate caddy
              echo "$new_sum" > .caddyfile.sha256
            fi
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          API_DOMAIN: ${{ vars.API_DOMAIN || 'api.gatherspace.in' }}
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://${{ vars.API_DOMAIN || 'api.gatherspace.in' }}/api/health" && exit 0
            sleep 6
          done
          exit 1
