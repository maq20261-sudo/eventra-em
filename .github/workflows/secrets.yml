# Secret scan on every push and PR (full history), using .gitleaks.toml.
# The repo is public: anything committed is visible to everyone, even after
# deletion, so a hit here means rotate the secret, not just delete the line.
name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="--all"
